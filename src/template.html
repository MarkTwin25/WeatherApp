<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
<title>Weather App</title>
</head>
<body>
    <main>
        <!-- Intro  -->
         <section class="intro" id="intro">
             <!-- Searching section -->
              <section class="search-section">
                <h1 class="title">
                    Weather 
                    <span class="secondary-color">
                        App
                    </span>
                </h1>

                <p class="intro-description">Choose a city to see its climate</p>
                
                <form action="" class="search-intro" id="search-intro">
                    <div class="search-content">
                        <input type="text" class="input-intro" id="input-intro" placeholder="Search location">
                        <button type="submit">
                            <svg xmlns="http://www.w3.org/2000/svg" width="36" height="20" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                                <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                            </svg>
                        </button>
                    </div>
                    <p class="error hidden">Error!</p>
                </form>
              </section>
         </section>

         <!-- Results -->
          <section class="results" id="results">
              <section class="weather-section">
                <div class="left-side">
                    <form action="" class="search-main" id="search-main">
                        <div class="search-content">
                            <input type="text" class="input-main" id="input-main" placeholder="Search location">
                            <button type="submit">
                                <svg xmlns="http://www.w3.org/2000/svg" width="36" height="20" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                                    <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                                </svg>
                            </button>
                        </div>
                        <p class="error hidden">Error!</p>
                    </form>

                    <div class="main-card bg-snow" id="main-card">
                        <div class="info">
                            <div class="general-info">
                                <div class="zone" id="zone">
                                </div>
                                <div class="hour" id="hour">
                                </div>
                                <div class="date" id="date">
                                </div>
                            </div>
                            <div class="temperature-type" id="temperature-type">
                                <p class="type celcius" id="celcius">
                                    C*
                                </p>
                                <p class="type farenheit" id="farenheit">
                                    F*
                                </p>
                            </div>
                        </div>

                        <div class="main-icon" id="main-icon">
                        </div>

                        <h1 class="temperature" id="temperature">
                        </h1>

                        <p class="temperature-info" id="temperature-info">
                        </p>
                    </div>
                </div>

                <div class="right-side">
                    <div class="forecast">
                        <div class="title">
                            Forecast for 5 days
                        </div>

                        <div class="days" id="days">
                        </div>

                    </div>

                    <div class="today-info">
                        <div class="day-details">
                            <div class="title">
                                Today's weather details
                            </div>

                            <div class="details">
                                <div class="detail">
                                    <div class="detail-info">
                                        <div class="detail-icon">
                                           <svg class="sunrise-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-sunrise" viewBox="0 0 16 16">
                                                <path d="M7.646 1.146a.5.5 0 0 1 .708 0l1.5 1.5a.5.5 0 0 1-.708.708L8.5 2.707V4.5a.5.5 0 0 1-1 0V2.707l-.646.647a.5.5 0 1 1-.708-.708zM2.343 4.343a.5.5 0 0 1 .707 0l1.414 1.414a.5.5 0 0 1-.707.707L2.343 5.05a.5.5 0 0 1 0-.707m11.314 0a.5.5 0 0 1 0 .707l-1.414 1.414a.5.5 0 1 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0M8 7a3 3 0 0 1 2.599 4.5H5.4A3 3 0 0 1 8 7m3.71 4.5a4 4 0 1 0-7.418 0H.499a.5.5 0 0 0 0 1h15a.5.5 0 0 0 0-1h-3.79zM0 10a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2A.5.5 0 0 1 0 10m13 0a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2a.5.5 0 0 1-.5-.5"/>
                                            </svg>
                                        </div>
                                        <p class="name-detail">
                                            Sunrise
                                        </p>
                                    </div>

                                    <p id="sunrise-value">
                                    </p>
                                </div>

                                <div class="detail">
                                    <div class="detail-info">
                                        <div class="detail-icon">
                                            <svg class="sunset-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-sunset" viewBox="0 0 16 16">
                                                <path d="M7.646 4.854a.5.5 0 0 0 .708 0l1.5-1.5a.5.5 0 0 0-.708-.708l-.646.647V1.5a.5.5 0 0 0-1 0v1.793l-.646-.647a.5.5 0 1 0-.708.708zm-5.303-.51a.5.5 0 0 1 .707 0l1.414 1.413a.5.5 0 0 1-.707.707L2.343 5.05a.5.5 0 0 1 0-.707zm11.314 0a.5.5 0 0 1 0 .706l-1.414 1.414a.5.5 0 1 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0zM8 7a3 3 0 0 1 2.599 4.5H5.4A3 3 0 0 1 8 7m3.71 4.5a4 4 0 1 0-7.418 0H.499a.5.5 0 0 0 0 1h15a.5.5 0 0 0 0-1h-3.79zM0 10a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2A.5.5 0 0 1 0 10m13 0a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2a.5.5 0 0 1-.5-.5"/>
                                            </svg>
                                        </div>
                                        <p class="name-detail">
                                            Sunset
                                        </p>
                                    </div>

                                    <p class="value" id="sunset-value">
                                    </p>
                                </div>

                                <div class="detail">
                                    <div class="detail-info">
                                        <div class="detail-icon">
                                            <svg class="wind-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-wind" viewBox="0 0 16 16">
                                                <path d="M12.5 2A2.5 2.5 0 0 0 10 4.5a.5.5 0 0 1-1 0A3.5 3.5 0 1 1 12.5 8H.5a.5.5 0 0 1 0-1h12a2.5 2.5 0 0 0 0-5m-7 1a1 1 0 0 0-1 1 .5.5 0 0 1-1 0 2 2 0 1 1 2 2h-5a.5.5 0 0 1 0-1h5a1 1 0 0 0 0-2M0 9.5A.5.5 0 0 1 .5 9h10.042a3 3 0 1 1-3 3 .5.5 0 0 1 1 0 2 2 0 1 0 2-2H.5a.5.5 0 0 1-.5-.5"/>
                                            </svg>
                                        </div>
                                        <p class="name-detail">
                                            Wind
                                        </p>
                                    </div>

                                    <p class="value" id="wind-value">
                                    </p>
                                </div>

                                <div class="detail">
                                    <div class="detail-info">
                                        <div class="detail-icon">
                                            <svg class="pressure-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-up-right" viewBox="0 0 16 16">
                                                <path fill-rule="evenodd" d="M14 2.5a.5.5 0 0 0-.5-.5h-6a.5.5 0 0 0 0 1h4.793L2.146 13.146a.5.5 0 0 0 .708.708L13 3.707V8.5a.5.5 0 0 0 1 0z"/>
                                            </svg>
                                        </div>
                                        <p class="name-detail">
                                            Pressure
                                        </p>
                                    </div>

                                    <p class="value" id="pressure-value">
                                    </p>
                                </div>

                                <div class="detail">
                                    <div class="detail-info">
                                        <div class="detail-icon">
                                            <svg class="uv-index-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-sun" viewBox="0 0 16 16">
                                                <path d="M8 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6m0 1a4 4 0 1 0 0-8 4 4 0 0 0 0 8M8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0m0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13m8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5M3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8m10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0m-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0m9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707M4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708"/>
                                            </svg>
                                        </div>
                                        <p class="name-detail">
                                            UV Index
                                        </p>
                                    </div>

                                    <p class="value" id="uv-index-value">
                                    </p>
                                </div>

                                <div class="detail">
                                    <div class="detail-info">
                                        <div class="detail-icon">
                                            <svg class="humidity-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-moisture" viewBox="0 0 16 16">
                                                <path d="M13.5 0a.5.5 0 0 0 0 1H15v2.75h-.5a.5.5 0 0 0 0 1h.5V7.5h-1.5a.5.5 0 0 0 0 1H15v2.75h-.5a.5.5 0 0 0 0 1h.5V15h-1.5a.5.5 0 0 0 0 1h2a.5.5 0 0 0 .5-.5V.5a.5.5 0 0 0-.5-.5zM7 1.5l.364-.343a.5.5 0 0 0-.728 0l-.002.002-.006.007-.022.023-.08.088a29 29 0 0 0-1.274 1.517c-.769.983-1.714 2.325-2.385 3.727C2.368 7.564 2 8.682 2 9.733 2 12.614 4.212 15 7 15s5-2.386 5-5.267c0-1.05-.368-2.169-.867-3.212-.671-1.402-1.616-2.744-2.385-3.727a29 29 0 0 0-1.354-1.605l-.022-.023-.006-.007-.002-.001zm0 0-.364-.343zm-.016.766L7 2.247l.016.019c.24.274.572.667.944 1.144.611.781 1.32 1.776 1.901 2.827H4.14c.58-1.051 1.29-2.046 1.9-2.827.373-.477.706-.87.945-1.144zM3 9.733c0-.755.244-1.612.638-2.496h6.724c.395.884.638 1.741.638 2.496C11 12.117 9.182 14 7 14s-4-1.883-4-4.267"/>
                                            </svg>
                                        </div>
                                        <p class="name-detail">
                                            Humidity
                                        </p>
                                    </div>

                                    <p class="value" id="humidity-value">
                                    </p>
                                </div>

                            </div>

                        </div>

                    </div>

                </div>
    
              </section>
          </section>

    </main>

    <footer class="footer">
        &#169;
        2026 -
        <a href="https://github.com/MarkTwin25">
            MarkTwin25 
        </a>
    </footer>

     </div>
    
</body>
</html>
