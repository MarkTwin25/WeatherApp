<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
<title>Weather App</title>
</head>
<body>

    <main>
        <!-- Intro  -->
         <section class="intro">
             <!-- Searching section -->
              <section class="search-section">
                <h1 class="title">
                    Weather 
                    <span class="secondary-color">
                        App
                    </span>
                </h1>

                <p class="intro-description">Choose a city to see its climate</p>
                
                <form action="" class="search-intro" id="search-intro">
                    <div class="search-content">
                        <input type="text" class="input-intro" id="input-intro" placeholder="Search location">
                        <button type="submit">
                            <svg xmlns="http://www.w3.org/2000/svg" width="36" height="20" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                                <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                            </svg>
                        </button>
                    </div>
                    <p class="error hidden">Error!</p>
                </form>
              </section>
         </section>

         <!-- Results -->
          <section class="results">
              <section class="weather-section">
    
              </section>
          </section>

    </main>

    <footer class="footer">
        &#169;
        2026 -
        MarkTwin25 
    </footer>
    
</body>
</html>
